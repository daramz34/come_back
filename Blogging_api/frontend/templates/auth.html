<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D Blog — Auth</title>
    <link rel="stylesheet" href="/static/base.css">
    <link rel="stylesheet" href="/static/auth.css">
</head>
<body>

    
    <nav>
        <a href="/" class="nav-logo">♟ D Blog</a>
        <div class="nav-links">
            <a href="/feed" class="btn btn-outline">Explore</a>
        </div>
    </nav>

    
    <section class="auth-section">
        <div class="auth-card">

            
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('register')">Register</button>
            </div>

            
            <div id="login-form" class="auth-form">
                <h2>Welcome Back</h2>
                <p class="auth-sub">Login to continue writing</p>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-username" placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password">
                </div>

                <p class="error-msg" id="login-error"></p>

                <button class="btn btn-primary full-width" onclick="login()">Login</button>

                <p class="auth-switch">Don't have an account? 
                    <span onclick="switchTab('register')">Register</span>
                </p>
            </div>

            
            <div id="register-form" class="auth-form hidden">
                <h2>Create Account</h2>
                <p class="auth-sub">Join D Blog today</p>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="reg-username" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" placeholder="Choose a password">
                </div>

                <p class="error-msg" id="register-error"></p>

                <button class="btn btn-primary full-width" onclick="register()">Create Account</button>

                <p class="auth-switch">Already have an account? 
                    <span onclick="switchTab('login')">Login</span>
                </p>
            </div>

        </div>
    </section>

    <script>
        function switchTab(tab) {
            document.getElementById('login-form').classList.add('hidden')
            document.getElementById('register-form').classList.add('hidden')
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'))

            document.getElementById(`${tab}-form`).classList.remove('hidden')
            event.target.classList.add('active')
        }
                
                async function login() {
                    const username = document.getElementById('login-username').value
                    const password = document.getElementById('login-password').value
                    const errorEl = document.getElementById('login-error')

                    if (!username || !password) {
                        errorEl.textContent = 'Please enter your username and password'
                        return
                    }

                    const formData = new URLSearchParams()
                    formData.append('username', username)
                    formData.append('password', password)

                    try {
                        const res = await fetch('/api/v1/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: formData
                        })
                        const data = await res.json()

                        if (!res.ok) {
                            errorEl.textContent = 'Invalid username or password'
                            return
                        }

                        localStorage.setItem('token', data.access_token)
                        window.location.href = '/feed'

                    } catch (err) {
                        errorEl.textContent = 'Something went wrong'
                    }
                }

               async function register() {
                const username = document.getElementById('reg-username').value
                const email = document.getElementById('reg-email').value
                const password = document.getElementById('reg-password').value
                const errorEl = document.getElementById('register-error')

                if (!username || !email || !password) {
                    errorEl.textContent = 'All fields are required'
                    return
                }

                
                try {
                    const res = await fetch('/api/v1/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, password })
                    })
                    const data = await res.json()

                    if (!res.ok) {
                        errorEl.textContent = typeof data.detail === 'string'
                            ? data.detail
                            : JSON.stringify(data.detail)
                        return
                    }

                    switchTab('login')
                    alert('Account created! Please login.')

                } catch (err) {
                    errorEl.textContent = 'Something went wrong'
                }
            }
    </script>

</body>
</html>
