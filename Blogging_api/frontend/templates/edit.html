<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D Blog — Edit Post</title>
    <link rel="stylesheet" href="/static/base.css">
    <link rel="stylesheet" href="/static/create.css">
</head>
<body>

    
    <nav>
        <a href="/" class="nav-logo">♟ D Blog</a>
        <div class="nav-links">
            <a href="/feed" class="btn btn-outline">Feed</a>
            <a href="/dashboard" class="btn btn-outline">Dashboard</a>
            <button class="btn btn-primary" onclick="logout()">Logout</button>
        </div>
    </nav>

    
    <section class="create-section">
        <div class="create-container">
            <div class="create-header">
                <h1>Edit Post</h1>
                <p class="create-sub">Update your post</p>
            </div>

            <div class="form-group">
                <label>Title</label>
                <input type="text" id="post-title" placeholder="Give your post a title">
            </div>

            <div class="form-group">
                <label>Content</label>
                <textarea id="post-content" rows="12" placeholder="Write your post here..."></textarea>
            </div>

            <p class="error-msg" id="post-error"></p>

            <div class="create-actions">
                <a href="/dashboard" class="btn btn-outline">Cancel</a>
                <button class="btn btn-primary" onclick="updatePost()">Save Changes</button>
            </div>
        </div>
    </section>

    <script>
        const token = localStorage.getItem('token')
        const postId = window.location.pathname.split('/').pop()

        if (!token) {
            window.location.href = '/auth'
        }

        function logout() {
            localStorage.removeItem('token')
            window.location.href = '/'
        }

        // load existing post data into form
        async function loadPost() {
            try {
                const res = await fetch(`/api/v1/blog/posts/${postId}`)
                const post = await res.json()

                if (!res.ok) {
                    window.location.href = '/dashboard'
                    return
                }

                document.getElementById('post-title').value = post.title
                document.getElementById('post-content').value = post.content
                document.title = `Edit — ${post.title}`

            } catch (err) {
                window.location.href = '/dashboard'
            }
        }

        async function updatePost() {
            const title = document.getElementById('post-title').value
            const content = document.getElementById('post-content').value
            const errorEl = document.getElementById('post-error')

            if (!title || !content) {
                errorEl.textContent = 'Title and content are required'
                return
            }

            try {
                const res = await fetch(`/api/v1/blog/posts/${postId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ title, content })
                })
                const data = await res.json()

                if (!res.ok) {
                    errorEl.textContent = 'Failed to update post'
                    return
                }

                window.location.href = `/post/${postId}`

            } catch (err) {
                document.getElementById('post-error').textContent = 'Something went wrong'
            }
        }

        loadPost()
    </script>

</body>
</html>
